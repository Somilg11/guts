name: CI Multi-Platform Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: guts.linux-x64-gnu.node
          - host: macos-latest
            target: aarch64-apple-darwin
            name: guts.darwin-arm64.node
          - host: macos-latest
            target: x86_64-apple-darwin
            name: guts.darwin-x64.node
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            name: guts.win32-x64-msvc.node

    runs-on: ${{ matrix.settings.host }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.settings.target }}

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Native Binary
        run: npx napi build --release --target ${{ matrix.settings.target }}

      - name: Rename Artifact
        shell: bash
        run: |
          if [ -f "guts.node" ]; then
            mv guts.node ${{ matrix.settings.name }}
          elif [ -f "guts.${{ matrix.settings.target }}.node" ]; then
            mv guts.${{ matrix.settings.target }}.node ${{ matrix.settings.name }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.settings.name }}
          path: ${{ matrix.settings.name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # 1. Download all build matrix outputs into a staging directory
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging-binaries

      # 2. Extract all binaries into the root and print visual verification logs
      - name: Flatten & Log Native Binaries
        run: |
          find staging-binaries -name "*.node" -exec cp {} . \;
          echo "📸 VERIFYING PACKAGED BINARIES IN ROOT:"
          ls -la *.node

      - name: Sync Package Version with Git Tag
        run: |
          TAG_VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          npm version $TAG_VERSION --no-git-tag-version --allow-same-version

      - name: Clean package configurations
        run: npm install --ignore-scripts

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}